<!DOCTYPE html>
<head>
  <title>standby</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    p {
      display: grid;
      place-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <p id="time"></p>

  <script>
    const time = document.getElementById("time");

    function updateClock() {
      const timeStr = new Date().toLocaleTimeString();
      time.textContent = timeStr;
    }

    updateClock(); 
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
